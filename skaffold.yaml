apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: huma-app

build:
  artifacts:
    - image: huma
      docker:
        dockerfile: Dockerfile

test:
  - image: huma
    custom:
      - command: go test --cover ./...
        timeoutSeconds: 600
        dependencies:
          paths:
            - "**/*.go"
            - "**/*_test.go"
            - "go.mod"
            - "go.sum"

deploy:
  helm:
    releases:
      - name: db
        remoteChart: mongodb
        repo: https://charts.bitnami.com/bitnami
        version: 19.1.4
        namespace: "{{.NAMESPACE}}"
        createNamespace: true
        wait: true
        setValueTemplates:
          architecture: standalone
          useStatefulSet: true
          auth.databases[0]: "{{.DB_DATABASE_NAME}}"
          auth.usernames[0]: "{{.DB_USERNAME}}"
          auth.passwords[0]: "{{.DB_PASSWORD}}"

      - name: api
        chartPath: ./helm/huma
        namespace: "{{.NAMESPACE}}"
        createNamespace: true
        skipBuildDependencies: true
        setValueTemplates:
          deployment.replicas: "{{.API_DEPLOYMENT_REPLICAS}}"
          deployment.image.repository: "{{.IMAGE_REPO_huma}}"
          deployment.image.tag: "{{.IMAGE_TAG_huma}}@{{.IMAGE_DIGEST_huma}}"
          deployment.args[0]: "{{.API_DEPLOYMENT_ARG}}"
          deployment.container.name: "{{.API_DEPLOYMENT_CONTAINER_NAME}}"
          deployment.container.port: "{{.API_DEPLOYMENT_CONTAINER_PORT}}"
          service.port: "{{.API_SERVICE_PORT}}"
          secret.database.mongoUri: "mongodb://{{.DB_USERNAME}}:{{.DB_PASSWORD}}@{{.DB_HOST}}:{{.DB_PORT}}/{{.DB_DATABASE_NAME}}?authSource={{.DB_DATABASE_NAME}}"
