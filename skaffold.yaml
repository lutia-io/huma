apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: huma-app

build:
  artifacts:
    - image: huma
      docker:
        dockerfile: Dockerfile

test:
  - image: huma
    custom:
      - command: go test --cover ./...
        timeoutSeconds: 600

deploy:
  helm:
    releases:
      - name: mongodb
        remoteChart: mongodb
        repo: https://charts.bitnami.com/bitnami
        version: 19.1.11
        namespace: "{{.NAMESPACE}}"
        createNamespace: true
        wait: true
        setValueTemplates:
          architecture: standalone
          useStatefulSet: true
          auth.databases[0]: "{{.MONGODB_DATABASE_NAME}}"
          auth.usernames[0]: "{{.MONGODB_USERNAME}}"
          auth.passwords[0]: "{{.MONGODB_PASSWORD}}"

      - name: prometheus
        remoteChart: prometheus
        repo: https://prometheus-community.github.io/helm-charts
        namespace: "{{.NAMESPACE}}"
        createNamespace: true
        wait: true
        setValueTemplates:
          alertmanager.enabled: false
          kube-state-metrics.enabled: false
          prometheus-pushgateway.enabled: false

      - name: grafana
        remoteChart: grafana
        repo: https://grafana-community.github.io/helm-charts
        namespace: "{{.NAMESPACE}}"
        createNamespace: true
        wait: true
        setValueTemplates:
          persistence.enabled: true
          service.type: LoadBalancer
          service.port: 3000

      - name: api
        chartPath: ./helm/huma
        namespace: "{{.NAMESPACE}}"
        createNamespace: true
        skipBuildDependencies: true
        setValueTemplates:
          deployment.replicas: "{{.API_DEPLOYMENT_REPLICAS}}"
          deployment.image.repository: "{{.IMAGE_REPO_huma}}"
          deployment.image.tag: "{{.IMAGE_TAG_huma}}@{{.IMAGE_DIGEST_huma}}"
          deployment.args[0]: "{{.API_DEPLOYMENT_ARG}}"
          deployment.container.name: "{{.API_DEPLOYMENT_CONTAINER_NAME}}"
          deployment.container.port: "{{.API_DEPLOYMENT_CONTAINER_PORT}}"
          service.port: "{{.API_SERVICE_PORT}}"
          secret.database.mongoUri: "mongodb://{{.MONGODB_USERNAME}}:{{.MONGODB_PASSWORD}}@{{.MONGODB_HOST}}:{{.MONGODB_PORT}}/{{.MONGODB_DATABASE_NAME}}?authSource={{.MONGODB_DATABASE_NAME}}"
